name: wordpress-mcp
recipe: wordpress
config:
  php: '8.1'
  via: nginx
  webroot: .
  database: wordpress
  wp-version: 'latest'

proxy:
  appserver:
    - wordpress-mcp.lndo.site

services:
  appserver:
    run:
      - composer install

tooling:
  wp:
    service: appserver
  wordpress-mcp:
    service: appserver
    cmd: php /app/mcp-server/bin/wordpress-mcp
